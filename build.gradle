// A task to ensure that the version being released has not already been released.
tasks.register('checkVersion') {
    doFirst {
        def xml = new URL(
            "https://repo.maven.apache.org/maven2/dev/aoqia/leaf/yarn/maven-metadata.xml").text
        def metadata = new XmlSlurper().parseText(xml)
        def versions = metadata.versioning.versions.version*.text();
        if (versions.contains(version)) {
            throw new RuntimeException("${version} has already been released!")
        }
    }
}

jreleaser {
    project {
        name = rootProject.name
        version = rootProject.version
        versionPattern = 'SEMVER'
        authors = ['aoqia194', 'FabricMC']
        maintainers = ['aoqia194']
        license = 'MIT'
        inceptionYear = '2025'
        links {
            homepage = rootProject.url
            license = 'https://spdx.org/licenses/MIT.html'
        }
    }
    signing {
        active = 'ALWAYS'
        armored = true
        passphrase = ENV.GPG_PASSPHRASE_KEY
        publicKey = ENV.GPG_PUBLIC_KEY
        secretKey = ENV.GPG_PRIVATE_KEY
    }
    deploy {
        maven {
            pomchecker {
                version = "1.14.0"
                failOnWarning = false // annoying
                failOnError = true
                strict = true
            }
            mavenCentral {
                sonatype {
                    applyMavenCentralRules = true
                    active = "ALWAYS"
                    snapshotSupported = true
                    authorization = 'BEARER'
                    username = ENV.MAVEN_USERNAME
                    password = ENV.MAVEN_PASSWORD
                    url = "https://central.sonatype.com/api/v1/publisher"
                    stagingRepository("build/staging-deploy")
                    verifyUrl = "https://repo1.maven.org/maven2/{{path}}/{{filename}}"
                    namespace = rootProject.group
                    retryDelay = 60
                    maxRetries = 30
                }
            }
        }
    }

    release {
        github {
            enabled = true
            repoOwner = 'aoqia194'
            name = 'leaf-yarn'
            host = 'github.com'
            releaseName = '{{tagName}}'
            sign = true
            overwrite = true

            changelog {
                formatted = 'ALWAYS'
                preset = 'conventional-commits'

                append {
                    enabled = true
                }

                extraProperties.put('categorizeScopes', 'true')
            }
        }
    }
}

abstract class FileInputOutput extends DefaultTask implements WithFileInput, WithFileOutput {
}

@DisableCachingByDefault
abstract class EnigmaTask extends JavaExec {
    @InputFile
    abstract RegularFileProperty getJar()

    @Input
    abstract Property<File> getMappings()

    EnigmaTask() {
        def filamentCodeSource = MappingPoetTask.class.getProtectionDomain().getCodeSource()
        def filamentJarFile = new File(filamentCodeSource.getLocation().getFile())
        def runtimeClasspath = project.files()
        runtimeClasspath.from(project.configurations.enigmaRuntime)
        runtimeClasspath.from(filamentJarFile)

        classpath = runtimeClasspath
        mainClass.set('cuchaz.enigma.gui.Main')
        jvmArgs "-Xmx2048m"
    }

    @TaskAction
    void exec() {
        args '-jar'
        args jar.get().asFile.absolutePath
        args '-mappings'
        args mappings.get().absolutePath
        args '-profile'
        args 'enigma_profile.json'
        super.exec()
    }
}
