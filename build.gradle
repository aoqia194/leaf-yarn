buildscript {
    repositories {
        maven {
            name "Fabric Repository"
            url 'https://maven.fabricmc.net'
        }
        mavenCentral()
    }
    dependencies {
        classpath "cuchaz:enigma-cli:${project.enigma_version}"
    }
}

plugins {
    id 'java' // for constants, packages, javadoc
    id "com.diffplug.spotless" version "6.21.0"
    id 'dev.aoqia.leaf.loom' version '0.1.4'
    id 'dev.aoqia.leaf.filament' version '0.1.0'
    // Publishing to Maven Central
    id 'org.jreleaser' version '1.17.0'
    id 'maven-publish'
}

loom {
    clientOnlyZomboidJar()
}

filament {
    zomboidVersion = rootProject.zomboidVersion
}

def ENV = System.getenv()
def build_number = ENV.BUILD_NUMBER ?: "local"
def yarnVersion = "${project.zomboidVersion}+build.$build_number"
version = yarnVersion

if (ENV.BRANCH_NAME) {
    def branch = ENV.BRANCH_NAME.substring(ENV.BRANCH_NAME.lastIndexOf('/') + 1)
    if (project.zomboidVersion != branch) {
        throw new IllegalStateException("Branch name (${branch}) does not match the zomboid version (${project.zomboidVersion})")
    }
}

repositories {
    maven {
        name "Fabric Repository"
        url 'https://maven.fabricmc.net'
    }
    mavenCentral()
}

configurations {
    asm
    enigmaRuntime {
        extendsFrom asm
    }
    javadocClasspath
    decompileClasspath
}

def unpickMetaFile = file("unpick-definitions/unpick.json")

dependencies {
    enigmaRuntime "cuchaz:enigma-swing:${project.enigma_version}"
    enigmaRuntime "net.fabricmc:cfr:${project.cfr_version}"
    asm "org.ow2.asm:asm:${project.asm_version}"
    asm "org.ow2.asm:asm-tree:${project.asm_version}"
    asm "org.ow2.asm:asm-commons:${project.asm_version}"
    asm "org.ow2.asm:asm-util:${project.asm_version}"
    // TODO: Uncomment when loader is published
//    javadocClasspath "${project.group}:loader:${project.leaf_loader_version}"
    javadocClasspath "org.jetbrains:annotations:${project.jetbrains_annotations_version}"
    javadocClasspath "com.google.code.findbugs:jsr305:3.0.2" // for some other jsr annotations
    // Adding JUnit to decompiler classpath for javadoc bc zomboid doesnt include it
    javadocClasspath "junit:junit:4.13.2"
    // Decompiler Classpath (gets passed to decompilers)
    decompileClasspath "net.fabricmc:cfr:${project.cfr_version}"
    decompileClasspath "org.vineflower:vineflower:${project.vineflower_version}"
    // Dummy dependency for loom
    zomboid "com.theindiestone:zomboid:${project.zomboidVersion}"
}

