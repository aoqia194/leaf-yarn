name: Build

on:
  push:
  pull_request:
  workflow_call:
  workflow_run:
    workflows:
      - manual
    types:
      - requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -S --warning-mode fail

      - name: Generate Javadoc Jar
        run: ./gradlew javadocJar -S --warning-mode fail

      - name: Check Mappings
        run: ./gradlew checkMappings -S --warning-mode fail

      - name: Format Mappings
        run: ./gradlew formatMappings -S --warning-mode fail

      - name: Check Uncommited Changes
        run: if [ -n "$(git status --porcelain)" ]; then exit 1; fi

      - name: Upload Build Output
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  test-build-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: gradle/wrapper-validation-action@v2

      - name: Build Filament
        run: ./gradlew :filament:build -S
