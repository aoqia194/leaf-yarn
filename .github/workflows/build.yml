name: Build

on:
# I don't want my self hosted runner that isn't available 24/7 to run builds constantly.
#  - push
#  - pull_request
  - workflow_call
  - workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -S

      - name: Generate Javadoc Jar
        run: ./gradlew javadocJar -S

      - name: Check Mappings
        run: ./gradlew checkMappings -S

      - name: Format Mappings
        run: ./gradlew formatMappings -S

      - name: Check Uncommited Changes
        run: if [ -n "$(git status --porcelain)" ]; then exit 1; fi

      - name: Upload Build Output
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 7
          if-no-files-found: error
          overwrite: true
