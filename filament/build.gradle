import org.gradle.util.GradleVersion

plugins {
	id 'java-library'
	// id 'checkstyle'
    id 'leaf-loom' version '0.1.0.local'
    // Publishing to Maven Central
    id 'org.jreleaser' version '1.16.+'
	id 'maven-publish'
    // Publishing to Gradle Plugin Portal
    id 'com.gradle.plugin-publish' version '1.3.+'
}

def ENV = System.getenv()
if (!ENV.CI) {
    version = "${version}.local"
}

// Needed to read the main projects properties
def properties = new Properties()
file('../gradle.properties').newInputStream().withCloseable {
	properties.load(it)
}

repositories {
	maven {
		name "Fabric Repository"
		url 'https://maven.fabricmc.net'
	}
	mavenCentral()
    mavenLocal()
}

dependencies {
	implementation "org.ow2.asm:asm:${properties.asm_version}"
	implementation "org.ow2.asm:asm-tree:${properties.asm_version}"
	implementation "cuchaz:enigma:$properties.enigma_version"
	implementation "cuchaz:enigma-cli:$properties.enigma_version"
	implementation "net.fabricmc.unpick:unpick:$properties.unpick_version"
	implementation "net.fabricmc.unpick:unpick-format-utils:$properties.unpick_version"
	implementation "net.fabricmc.unpick:unpick-cli:$properties.unpick_version"
	implementation "net.fabricmc:tiny-remapper:$properties.tiny_remapper_version"
	implementation 'net.fabricmc:mapping-io:0.6.1'
	implementation 'net.fabricmc:javapoet:0.1.1'

    // Dummy zomboid dependency to ensure generation of game files n stuff from loom.
    zomboid "com.theindiestone:zomboid:${properties.zomboidVersion}"

	testImplementation platform("org.junit:junit-bom:$properties.junit_version")
	testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "org.assertj:assertj-core:$properties.assertj_version"
}

loom {
    clientOnlyZomboidJar()
}

tasks.named('build').configure {
    doFirst {
        def loomClass = classLoader.loadClass("${project.group}.loom.SomeClass")
        println loomClass
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 17
}

test {
	useJUnitPlatform()
}

//checkstyle {
//	configFile = file('checkstyle.xml')
//	toolVersion = '10.13.0'
//}

// Workaround https://github.com/gradle/gradle/issues/27035
//configurations.checkstyle {
//	resolutionStrategy.capabilitiesResolution.withCapability("com.google.
//	collections:google-collections") {
//		select("com.google.guava:guava:0")
//	}
//}

gradlePlugin {
    website = project.url
    vcsUrl = project.url

	plugins {
		filament {
			id = "${project.group}.${project.name}"
            displayName = project.name
            description = project.description
            tags.set(['projectzomboid', 'zomboid', 'leaf'])
			implementationClass = "${project.group}.${project.name}.FilamentGradlePlugin"
		}
	}
}

// Because jreleaser 1.16.0 doesnt create the dir some reason
tasks.register('createJreleaserDir') {
    layout.buildDirectory.file('jreleaser').get().asFile.mkdirs()
}
tasks.named('jreleaserFullRelease').configure {
    dependsOn 'createJreleaserDir'
}
tasks.named('jreleaserConfig').configure {
    dependsOn 'createJreleaserDir'
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = project.name
            group = project.group
            description = project.description
            url = project.url
            inceptionYear = '2025'
            developers {
                developer {
                    id = 'aoqia'
                    name = 'aoqia'
                }
            }
            issueManagement {
                system = 'GitHub'
                url = "${project.url}/issues"
            }
            licenses {
                license {
                    name = 'CC0-1.0'
                    url = 'https://spdx.org/licenses/CC0-1.0.html'
                }
            }
            scm {
                connection = "scm:git:https://github.com/aoqia194/" + project.name + "/.git"
                developerConnection = "scm:git:ssh://github.com/aoqia194/" + project.name + "/.git"
                url = project.url
            }
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir("staging-deploy")
        }
    }
}

/**
 * Run this task to download the gradle sources next to the api jar, you may need to manually
 * attach the sources jar
 */
tasks.register('downloadGradleSources') {
	doLast {
		// Awful hack to find the gradle api location
		def gradleApiFile = project.configurations.detachedConfiguration(dependencies.gradleApi())
            .files.stream()
			.filter {
				it.name.startsWith("gradle-api")
			}.findFirst().orElseThrow()

		def gradleApiSources = new File(gradleApiFile.absolutePath.replace(".jar", "-sources.jar"))
		def url = "https://services.gradle.org/distributions/gradle-${GradleVersion.current().
            getVersion()}-src.zip"

		gradleApiSources.delete()

		println("Downloading (${url}) to (${gradleApiSources})")
		gradleApiSources << new URL(url).newInputStream()
	}
}
